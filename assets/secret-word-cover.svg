<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1f6b"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="y" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#3f4a5c"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="owl" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/>
    </radialGradient>
    <g id="tile">
      <rect x="0" y="8" width="104" height="104" rx="20" fill="#000" opacity="0.3"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#blobA)"/>
  <rect width="800" height="600" fill="url(#blobB)"/>

  <!-- faint empty rows -->
  <g fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.15" stroke-width="3">
    <rect x="128" y="372" width="96" height="96" rx="18"/><rect x="236" y="372" width="96" height="96" rx="18"/>
    <rect x="344" y="372" width="96" height="96" rx="18"/><rect x="452" y="372" width="96" height="96" rx="18"/>
    <rect x="560" y="372" width="96" height="96" rx="18"/>
    <rect x="128" y="480" width="96" height="96" rx="18"/><rect x="236" y="480" width="96" height="96" rx="18"/>
    <rect x="344" y="480" width="96" height="96" rx="18"/><rect x="452" y="480" width="96" height="96" rx="18"/>
    <rect x="560" y="480" width="96" height="96" rx="18"/>
  </g>

  <!-- WORD tiles -->
  <g font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="64" text-anchor="middle" fill="#fff">
    <g transform="translate(110 70) rotate(-6)">
      <rect y="6" width="116" height="116" rx="22" fill="#000" opacity="0.3"/>
      <rect width="116" height="116" rx="22" fill="url(#g)"/><rect x="4" y="4" width="108" height="50" rx="18" fill="url(#hl)"/>
      <text x="58" y="81">W</text>
    </g>
    <g transform="translate(244 54) rotate(3)">
      <rect y="6" width="116" height="116" rx="22" fill="#000" opacity="0.3"/>
      <rect width="116" height="116" rx="22" fill="url(#y)"/><rect x="4" y="4" width="108" height="50" rx="18" fill="url(#hl)"/>
      <text x="58" y="81">O</text>
    </g>
    <g transform="translate(378 72) rotate(-3)">
      <rect y="6" width="116" height="116" rx="22" fill="#000" opacity="0.3"/>
      <rect width="116" height="116" rx="22" fill="url(#g)"/><rect x="4" y="4" width="108" height="50" rx="18" fill="url(#hl)"/>
      <text x="58" y="81">R</text>
    </g>
    <g transform="translate(512 58) rotate(5)">
      <rect y="6" width="116" height="116" rx="22" fill="#000" opacity="0.3"/>
      <rect width="116" height="116" rx="22" fill="url(#s)"/><rect x="4" y="4" width="108" height="50" rx="18" fill="url(#hl)"/>
      <text x="58" y="81">D</text>
    </g>
    <text x="400" y="290" font-size="78" fill="#fff" letter-spacing="4">SECRET WORD</text>
    <text x="400" y="336" font-size="26" font-weight="700" fill="#fff" fill-opacity="0.75" letter-spacing="3">LEVELS 1 · 2 · 3 · ADULT</text>
  </g>

  <!-- confetti -->
  <g>
    <rect x="80" y="230" width="14" height="8" fill="#f472b6" transform="rotate(30 87 234)"/>
    <rect x="700" y="210" width="14" height="8" fill="#60a5fa" transform="rotate(-20 707 214)"/>
    <rect x="690" y="70" width="12" height="7" fill="#fcd34d" transform="rotate(50 696 73)"/>
    <rect x="60" y="120" width="12" height="7" fill="#4ade80" transform="rotate(-40 66 123)"/>
    <circle cx="730" cy="150" r="5" fill="#fff"/><circle cx="50" cy="300" r="4" fill="#fcd34d"/>
  </g>

  <!-- Hoot the owl -->
  <g transform="translate(690 470)">
    <ellipse cx="0" cy="98" rx="62" ry="10" fill="#000" opacity="0.25"/>
    <path d="M-66 -48 L-55 -100 L-22 -70 Z M66 -48 L55 -100 L22 -70 Z" fill="#7c3aed"/>
    <ellipse cx="-72" cy="18" rx="22" ry="46" fill="#6d28d9" transform="rotate(-20 -72 18)"/>
    <ellipse cx="72" cy="18" rx="22" ry="46" fill="#6d28d9" transform="rotate(20 72 18)"/>
    <ellipse cx="0" cy="0" rx="80" ry="92" fill="url(#owl)"/>
    <ellipse cx="0" cy="38" rx="48" ry="44" fill="#ede9fe"/>
    <circle cx="-32" cy="-26" r="30" fill="#f5f3ff"/><circle cx="32" cy="-26" r="30" fill="#f5f3ff"/>
    <path d="M-45 -22 A14 14 0 0 1 -19 -22 M19 -22 A14 14 0 0 1 45 -22" fill="none" stroke="#1e1b4b" stroke-width="7" stroke-linecap="round"/>
    <path d="M-11 -7 L11 -7 L0 12 Z" fill="#fbbf24"/>
    <ellipse cx="-26" cy="90" rx="15" ry="7" fill="#f59e0b"/><ellipse cx="26" cy="90" rx="15" ry="7" fill="#f59e0b"/>
  </g>
</svg>
