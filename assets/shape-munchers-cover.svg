<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#2a1260"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="78" height="78" x="1" y="1" rx="8" fill="#1c2660" stroke="#3b4fb0" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- the munching board, fading into the sky -->
  <rect x="0" y="330" width="800" height="270" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="300" width="800" height="120" fill="url(#sky)" opacity="0.55"/>

  <g fill="#fff" opacity="0.7">
    <rect x="60" y="40" width="4" height="4"/><rect x="180" y="110" width="3" height="3"/>
    <rect x="320" y="30" width="3" height="3"/><rect x="520" y="70" width="4" height="4"/>
    <rect x="700" y="40" width="3" height="3"/><rect x="740" y="150" width="4" height="4"/>
    <rect x="40" y="200" width="3" height="3"/><rect x="620" y="210" width="3" height="3"/>
  </g>

  <!-- title -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold" text-anchor="middle" filter="url(#glow)">
    <text x="400" y="110" font-size="84" fill="#6be04f" letter-spacing="6">SHAPE</text>
    <text x="400" y="195" font-size="72" fill="#ffe14f" letter-spacing="6">MUNCHERS</text>
  </g>

  <!-- shapes waiting to be munched -->
  <g stroke="#fff" stroke-width="5" stroke-linejoin="round" filter="url(#glow)">
    <polygon points="560,290 610,315 610,365 560,390 510,365 510,315" fill="#4ff0ff"/>
    <polygon points="700,275 714,315 756,315 722,340 735,380 700,356 665,380 678,340 644,315 686,315" fill="#ffe14f"/>
    <rect x="640" y="420" width="90" height="90" rx="4" fill="#ff4f6d" transform="rotate(-10 685 465)"/>
    <circle cx="520" cy="480" r="46" fill="#c88bff"/>
    <polygon points="110,300 152,330 136,380 84,380 68,330" fill="#ffb03f"/>
    <polygon points="90,430 170,430 150,490 70,490" fill="#ff7ad9"/>
  </g>

  <!-- the muncher, chomping a triangle -->
  <g transform="translate(330 430)">
    <ellipse cx="0" cy="118" rx="95" ry="12" fill="#000" opacity="0.35"/>
    <rect x="-55" y="78" width="34" height="26" rx="6" fill="#3f9a2f"/>
    <rect x="21" y="78" width="34" height="26" rx="6" fill="#3f9a2f"/>
    <circle cx="0" cy="0" r="100" fill="#6be04f"/>
    <ellipse cx="-45" cy="-45" rx="22" ry="14" fill="#9cf27f"/>
    <path d="M10,10 Q55,-15 98,18 Q70,80 18,62 Q-5,40 10,10 Z" fill="#2a0d1a"/>
    <rect x="32" y="12" width="16" height="16" fill="#fff"/>
    <rect x="62" y="16" width="16" height="16" fill="#fff"/>
    <circle cx="-25" cy="-88" r="30" fill="#fff"/>
    <circle cx="38" cy="-98" r="30" fill="#fff"/>
    <rect x="-18" y="-96" width="16" height="16" fill="#111"/>
    <rect x="45" y="-106" width="16" height="16" fill="#111"/>
    <polygon points="95,8 175,40 100,70" fill="#4f8bff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
