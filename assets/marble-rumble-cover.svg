<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Launcher cover in the style of the game's glass home screen: the logo over a dusk race -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1240"/>
      <stop offset="0.45" stop-color="#3a1f86"/>
      <stop offset="0.72" stop-color="#b8459e"/>
      <stop offset="0.9" stop-color="#ff8a4d"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a6a"/>
      <stop offset="1" stop-color="#120b34"/>
    </linearGradient>
    <linearGradient id="track" x1="1" y1="0" x2="0" y2="0.4">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset="0.45" stop-color="#3ad6e0"/>
      <stop offset="1" stop-color="#2f7dff"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6fdff"/>
      <stop offset="0.36" stop-color="#5ff3ff"/>
      <stop offset="0.7" stop-color="#4f8bff"/>
      <stop offset="1" stop-color="#b45cff"/>
    </linearGradient>
    <radialGradient id="mOrange" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffe2c0"/><stop offset="0.35" stop-color="#ff6b2c"/><stop offset="1" stop-color="#8a2606"/>
    </radialGradient>
    <radialGradient id="mBlue" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#d6ecff"/><stop offset="0.35" stop-color="#2f8cff"/><stop offset="1" stop-color="#0b3474"/>
    </radialGradient>
    <radialGradient id="mGreen" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#e6ffd0"/><stop offset="0.35" stop-color="#3ccf4e"/><stop offset="1" stop-color="#135e24"/>
    </radialGradient>
    <radialGradient id="mPurple" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f0dcff"/><stop offset="0.35" stop-color="#9b5cff"/><stop offset="1" stop-color="#3c1784"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c0"/><stop offset="0.35" stop-color="#ffb36b" stop-opacity="0.8"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="610" cy="330" r="170" fill="url(#sun)"/>
  <g fill="#fff">
    <circle cx="520" cy="40" r="2"/><circle cx="600" cy="90" r="1.6"/><circle cx="690" cy="30" r="2.4"/>
    <circle cx="760" cy="110" r="1.6"/><circle cx="450" cy="120" r="1.4"/><circle cx="730" cy="190" r="1.4"/>
    <circle cx="640" cy="150" r="1.8"/>
  </g>
  <path d="M0 360 Q120 300 240 345 Q360 300 470 340 Q600 290 800 330 V600 H0Z" fill="url(#hills)"/>
  <path d="M0 420 Q160 380 330 420 Q520 370 800 410 V600 H0Z" fill="#100a2c"/>

  <!-- support pillars -->
  <g fill="#2b2160">
    <rect x="690" y="275" width="10" height="120"/><rect x="560" y="315" width="14" height="130"/>
    <rect x="390" y="380" width="18" height="140"/>
  </g>

  <!-- the run: thickness, surface, glass wall -->
  <path d="M800 280 C680 300 560 345 440 410 S170 530 -20 565 L-20 600 C170 572 330 520 470 452 S690 330 800 300Z" fill="#1a1450"/>
  <path d="M800 236 C650 250 540 296 420 352 S150 452 -20 470 L-20 565 C170 530 320 470 440 410 S680 300 800 280Z" fill="url(#track)"/>
  <!-- boost chevrons -->
  <g fill="#ffd23f" opacity="0.9">
    <path d="M282 482 l38 -20 l-8 20 l-38 20z"/><path d="M326 460 l36 -19 l-8 19 l-36 19z"/><path d="M368 438 l34 -18 l-8 18 l-34 18z"/>
  </g>
  <path d="M800 206 C650 220 540 266 420 322 S150 422 -20 440 L-20 470 C150 452 300 400 420 352 S650 250 800 236Z" fill="#cff6ff" opacity="0.22"/>
  <path d="M800 206 C650 220 540 266 420 322 S150 422 -20 440" stroke="#fff" stroke-width="4" fill="none" opacity="0.85"/>

  <!-- marbles racing -->
  <g>
    <ellipse cx="672" cy="276" rx="18" ry="6" fill="#000" opacity="0.25"/>
    <circle cx="672" cy="262" r="16" fill="url(#mPurple)"/>
    <ellipse cx="560" cy="318" rx="24" ry="8" fill="#000" opacity="0.25"/>
    <circle cx="560" cy="300" r="22" fill="url(#mGreen)"/>
    <ellipse cx="430" cy="384" rx="34" ry="10" fill="#000" opacity="0.25"/>
    <circle cx="430" cy="358" r="31" fill="url(#mBlue)"/>
    <g stroke="#fff" stroke-linecap="round" opacity="0.75">
      <path d="M40 520 L118 492" stroke-width="7"/><path d="M60 550 L130 524" stroke-width="5"/><path d="M30 490 L96 466" stroke-width="4"/>
    </g>
    <ellipse cx="200" cy="528" rx="58" ry="14" fill="#000" opacity="0.3"/>
    <circle cx="200" cy="482" r="54" fill="url(#mOrange)"/>
    <path d="M160 470 Q200 444 242 480" stroke="#ffe14f" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M164 506 Q204 524 246 494" stroke="#ffe14f" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <ellipse cx="180" cy="458" rx="16" ry="10" fill="#fff" opacity="0.75" transform="rotate(-30 180 458)"/>
  </g>

  <!-- the logo, set like the home screen's: skewed heavy type -->
  <g transform="translate(46 0) skewX(-9)" font-family="system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <text x="22" y="86" font-size="54" letter-spacing="4" fill="#10204a" opacity="0.6" filter="url(#soft)">MARBLE</text>
    <text x="22" y="82" font-size="54" letter-spacing="4" fill="#fff" stroke="#10204a" stroke-width="3" paint-order="stroke">MARBLE</text>
    <g filter="url(#shadow)">
      <text x="14" y="196" font-size="132" letter-spacing="-1" fill="url(#logo)" stroke="#10204a" stroke-width="9" stroke-linejoin="round" paint-order="stroke">RUMBLE</text>
    </g>
    <!-- the rolling dots under the logo -->
    <g>
      <circle cx="38" cy="238" r="17" fill="#ff6b2c"/>
      <circle cx="80" cy="238" r="13" fill="#2f8cff" opacity="0.85"/>
      <circle cx="113" cy="238" r="10" fill="#3ccf4e" opacity="0.7"/>
      <circle cx="139" cy="238" r="8" fill="#9b5cff" opacity="0.55"/>
      <g fill="#fff" opacity="0.5">
        <circle cx="32" cy="232" r="5"/><circle cx="76" cy="234" r="4"/><circle cx="110" cy="235" r="3"/><circle cx="137" cy="236" r="2.4"/>
      </g>
    </g>
  </g>

  <!-- glass tagline pill -->
  <g font-family="system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <rect x="440" y="526" width="334" height="48" rx="24" fill="#0c1030" fill-opacity="0.66" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
    <text x="607" y="557" font-size="19" letter-spacing="2.4" fill="#c3cbe8" text-anchor="middle">BUILD IT &#183; RACE IT &#183; WIN</text>
  </g>
</svg>
