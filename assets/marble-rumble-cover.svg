<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#bdeeff"/>
    </linearGradient>
    <radialGradient id="mOrange" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffd6a8"/>
      <stop offset="0.35" stop-color="#ff6b2c"/>
      <stop offset="1" stop-color="#a8320a"/>
    </radialGradient>
    <radialGradient id="mBlue" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#d6ecff"/>
      <stop offset="0.35" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#0d3f8a"/>
    </radialGradient>
    <radialGradient id="mGreen" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#e6ffd0"/>
      <stop offset="0.35" stop-color="#3ccf4e"/>
      <stop offset="1" stop-color="#16702a"/>
    </radialGradient>
    <radialGradient id="mPurple" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f0dcff"/>
      <stop offset="0.35" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#4a1e9a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- grass -->
  <rect y="470" width="800" height="130" fill="#6cc04a"/>
  <g fill="#62b442">
    <rect x="0" y="470" width="80" height="40"/><rect x="160" y="470" width="80" height="40"/>
    <rect x="320" y="470" width="80" height="40"/><rect x="480" y="470" width="80" height="40"/>
    <rect x="640" y="470" width="80" height="40"/><rect x="80" y="510" width="80" height="45"/>
    <rect x="240" y="510" width="80" height="45"/><rect x="400" y="510" width="80" height="45"/>
    <rect x="560" y="510" width="80" height="45"/><rect x="720" y="510" width="80" height="45"/>
  </g>

  <!-- pillars -->
  <g fill="#9aa7c0">
    <rect x="118" y="250" width="12" height="230"/><rect x="300" y="300" width="12" height="180"/>
    <rect x="470" y="350" width="12" height="130"/><rect x="650" y="395" width="12" height="85"/>
  </g>

  <!-- the zig-zag run: a ramp down, a turn, another ramp -->
  <path d="M40 210 L330 280 L330 318 L40 248 Z" fill="#4fd1c5"/>
  <path d="M330 280 L560 330 L560 368 L330 318 Z" fill="#b794f4"/>
  <path d="M560 330 L780 380 L780 418 L560 368 Z" fill="#4fa8ff"/>
  <path d="M40 248 L780 418 L780 430 L40 260 Z" fill="#3a3f58"/>
  <!-- glass walls -->
  <path d="M40 170 L780 340 L780 380 L40 210 Z" fill="#cff6ff" opacity="0.35"/>
  <path d="M40 170 L780 340" stroke="#fff" stroke-width="5" fill="none"/>

  <!-- spinner bar on the purple piece -->
  <rect x="438" y="287" width="10" height="40" fill="#3a3f58"/>
  <g transform="rotate(-18 443 300)">
    <rect x="370" y="292" width="146" height="16" rx="5" fill="#ff4a4a" stroke="#a81e1e" stroke-width="3"/>
  </g>

  <!-- hammer swinging over the blue piece -->
  <rect x="625" y="160" width="10" height="230" fill="#3a3f58"/>
  <rect x="710" y="180" width="10" height="230" fill="#3a3f58"/>
  <rect x="620" y="155" width="105" height="12" fill="#3a3f58"/>
  <g transform="rotate(28 672 165)">
    <rect x="668" y="165" width="9" height="160" fill="#ffffff"/>
    <rect x="638" y="318" width="70" height="40" rx="10" fill="#ffd23f" stroke="#b08a00" stroke-width="4"/>
  </g>

  <!-- stars -->
  <g fill="#ffd400" stroke="#b08a00" stroke-width="3" filter="url(#glow)">
    <path transform="translate(250 220) scale(1.1)" d="M0 -18 L5 -6 L18 -6 L8 2 L12 15 L0 7 L-12 15 L-8 2 L-18 -6 L-5 -6 Z"/>
    <path transform="translate(560 290) scale(0.9)" d="M0 -18 L5 -6 L18 -6 L8 2 L12 15 L0 7 L-12 15 L-8 2 L-18 -6 L-5 -6 Z"/>
  </g>

  <!-- marbles -->
  <g>
    <circle cx="120" cy="208" r="30" fill="url(#mPurple)"/>
    <circle cx="190" cy="226" r="32" fill="url(#mGreen)"/>
    <circle cx="275" cy="250" r="36" fill="url(#mBlue)"/>
    <circle cx="350" cy="260" r="44" fill="url(#mOrange)"/>
    <path d="M318 250 Q350 228 382 262" stroke="#ffe14f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M322 278 Q352 292 386 270" stroke="#ffe14f" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M290 236 L250 226"/><path d="M296 262 L246 250"/><path d="M300 288 L262 279"/>
  </g>

  <!-- title -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold" text-anchor="middle">
    <text x="400" y="96" font-size="92" fill="#1a1f5c" stroke="#1a1f5c" stroke-width="14" stroke-linejoin="round">MARBLE</text>
    <text x="400" y="96" font-size="92" fill="#ffe14f">MARBLE</text>
    <text x="400" y="560" font-size="84" fill="#1a1f5c" stroke="#1a1f5c" stroke-width="14" stroke-linejoin="round">RUMBLE</text>
    <text x="400" y="560" font-size="84" fill="#ff6b2c">RUMBLE</text>
  </g>
</svg>
