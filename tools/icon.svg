<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MickleCade app icon, in the style of the games' glass menus. Render with make_icon.py -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26157a"/>
      <stop offset="1" stop-color="#0a0620"/>
    </linearGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.75"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ff0ff" stop-opacity="0.55"/><stop offset="1" stop-color="#4ff0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset="0.38" stop-color="#ffd23f"/>
      <stop offset="0.72" stop-color="#ff8a2b"/>
      <stop offset="1" stop-color="#ff4f6d"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="marble" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ddf3ff"/><stop offset="0.35" stop-color="#4fb4ff"/><stop offset="1" stop-color="#0b3474"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="420" cy="80" r="260" fill="url(#pink)"/>
  <circle cx="70" cy="460" r="240" fill="url(#cyan)"/>

  <!-- the frosted glass card -->
  <rect x="58" y="58" width="396" height="396" rx="72" fill="#120b34" fill-opacity="0.5" stroke="url(#glassEdge)" stroke-width="5"/>

  <!-- the big M -->
  <g transform="translate(0 0) skewX(-9)" filter="url(#shadow)">
    <text x="298" y="340" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="330"
          fill="url(#logo)" stroke="#2a0f5a" stroke-width="20" stroke-linejoin="round" paint-order="stroke">M</text>
  </g>

  <!-- speed stripes chasing a marble -->
  <g transform="skewX(-9)">
    <rect x="196" y="368" width="150" height="22" rx="11" fill="url(#hot)"/>
    <rect x="210" y="400" width="104" height="16" rx="8" fill="url(#hot)" opacity="0.65"/>
  </g>
  <circle cx="340" cy="388" r="38" fill="url(#marble)" stroke="#0a1a4a" stroke-width="5"/>
  <path d="M312 382 Q340 362 368 386" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>
  <ellipse cx="326" cy="372" rx="10" ry="6" fill="#fff" opacity="0.8" transform="rotate(-30 326 372)"/>
</svg>
