<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freddy Bear Run</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0618;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    touch-action: manipulation;
  }

  * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    touch-action: manipulation;
  }

  #back {
    align-self: flex-start;
    color: #4ff0ff;
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #4ff0ff;
  }

  canvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    border: 4px solid #4ff0ff;
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(79, 240, 255, 0.5);
    max-width: 95vw;
    height: auto;
    background: #000;
  }

  #hint {
    color: #ffe14f;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #ffe14f;
  }
</style>
</head>
<body>
  <div id="wrap">
    <a id="back" href="../../launcher/index.html">&larr; BACK TO MICKLECADE</a>
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hint">TAP / SPACE / UP / A BUTTON TO JUMP &mdash; HOLD FOR A HIGHER JUMP</div>
  </div>
  <script src="../../shared/gamepad.js"></script>
  <script src="game.js"></script>
</body>
</html>
