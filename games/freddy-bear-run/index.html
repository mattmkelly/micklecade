<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freddy Bear Run</title>
<link rel="icon" type="image/png" sizes="48x48" href="../../assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../assets/icon-192.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#120b28">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0618;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    touch-action: manipulation;
  }

  * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* As big as the window allows -- the back link and the how-to-play text live in the ☰ menu
     (shared/menu.js), so nothing outside the frame needs room. */
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-sizing: border-box;
    padding: 8px;
    width: min(100%, calc((100vh - 28px) * 16 / 9 + 16px));
    width: min(100%, calc((100dvh - 28px) * 16 / 9 + 16px));
    min-width: min(100%, 300px);
    touch-action: manipulation;
  }

  #back {
    align-self: flex-start;
    color: #4ff0ff;
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #4ff0ff;
  }

  canvas {
    border: 4px solid #4ff0ff;
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(79, 240, 255, 0.5);
    width: 100%;
    box-sizing: border-box;
    height: auto;
    background: #000;
  }

  #hint {
    color: #ffe14f;
    text-align: center;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #ffe14f;
  }
</style>
</head>
<body>
  <div id="wrap">
    <a id="back" href="../../launcher/index.html">&larr; BACK TO MICKLECADE</a>
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hint">TAP / SPACE / UP / A BUTTON TO JUMP &mdash; HOLD FOR A HIGHER JUMP</div>
  </div>
  <script src="../../shared/fullscreen.js"></script>
  <script src="../../shared/gamepad.js"></script>
  <script src="../../shared/hires.js"></script>
  <script src="../../shared/scores.js"></script>
  <script src="../../shared/menu.js" data-at="0,1"></script>
  <script src="game.js"></script>
</body>
</html>
