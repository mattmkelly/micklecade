<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snowbell: The Quest for the Golden Tablet</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #120b28;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    touch-action: manipulation;
  }

  * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }

  /* As wide as fits, but short enough that the back link above the game and the
     controls / hint below it always stay on screen. */
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px;
    width: min(100%, 720px, calc((100vh - 120px) * 16 / 9 + 16px));
    width: min(100%, 720px, calc((100dvh - 120px) * 16 / 9 + 16px));
    min-width: min(100%, 300px);
    touch-action: manipulation;
  }

  #back {
    align-self: flex-start;
    color: #ff9dc0;
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #ff9dc0;
  }

  canvas {
    border: 4px solid #ff9dc0;
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(255, 157, 192, 0.5);
    width: 100%;
    max-width: 720px;
    height: auto;
    background: #000;
    touch-action: none;
  }

  /* back link on the left, the TOUCH CONTROLS toggle (shared/touchpad.js) on the right */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
  }

  #hint {
    color: #ffe14f;
    font-size: 0.72rem;
    letter-spacing: 1px;
    text-align: center;
    text-shadow: 0 0 6px #ffe14f;
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="topbar">
      <a id="back" href="../../launcher/index.html">&larr; BACK TO MICKLECADE</a>
    </div>
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hint">ARROWS / A D / STICK TO MOVE &mdash; SPACE OR A BUTTON TO HOP &mdash; HOLD FOR A BIGGER HOP</div>
  </div>
  <script src="../../shared/gamepad.js"></script>
  <script src="../../shared/hires.js"></script>
  <script src="../../shared/scores.js"></script>
  <script src="../../shared/touchpad.js"></script>
  <script src="game.js"></script>
</body>
</html>
