<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Word</title>
<link rel="icon" type="image/png" sizes="48x48" href="../../assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../assets/icon-192.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#1e1b4b">
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0d0b24;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }

  /* As big as the window allows -- the back link and the how-to-play text live in the ☰ menu
     (shared/menu.js), so nothing outside the frame needs room. */
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px;
    width: min(100%, calc((100vh - 28px) * 16 / 9 + 16px));
    width: min(100%, calc((100dvh - 28px) * 16 / 9 + 16px));
    min-width: min(100%, 300px);
    touch-action: manipulation;
  }

  #back {
    align-self: flex-start;
    color: #4ff0ff;
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #4ff0ff;
  }

  canvas {
    border: 3px solid rgba(167, 139, 250, 0.7);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(124, 58, 237, 0.35), 0 0 0 1px rgba(255,255,255,0.06);
    width: 100%;
    max-width: 100%;
    height: auto;
    background: #1e1b4b;
    touch-action: none;
  }

  #hint {
    color: #ffd83d;
    font-size: 0.72rem;
    letter-spacing: 1px;
    text-align: center;
    text-shadow: 0 0 6px #ffd83d;
  }
</style>
</head>
<body>
  <div id="wrap">
    <a id="back" href="../../launcher/index.html">&larr; BACK TO MICKLECADE</a>
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hint">GUESS THE SECRET WORD! GREEN = RIGHT SPOT, YELLOW = IN THE WORD, GRAY = NOT IN IT. TYPE OR TAP LETTERS, ENTER TO GUESS. GET WORDS IN A ROW FOR STREAK BONUSES AND EXTRA HEARTS. CONTROLLER: D-PAD + A TYPE, B DELETE, START GUESS, Y HINT</div>
  </div>
  <script src="../../shared/fullscreen.js"></script>
  <script src="../../shared/gamepad.js"></script>
  <script src="../../shared/hires.js"></script>
  <script src="../../shared/scores.js"></script>
  <script src="../../shared/menu.js" data-at="0.158,0"></script>
  <script src="words.js"></script>
  <script src="game.js"></script>
</body>
</html>
