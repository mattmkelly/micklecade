<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munchy Math</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #070a1e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    touch-action: manipulation;
  }

  * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }

  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px;
    width: 100%;
    max-width: 720px;
    touch-action: manipulation;
  }

  #back {
    align-self: flex-start;
    color: #6be04f;
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #6be04f;
  }

  canvas {
    border: 4px solid #6be04f;
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(107, 224, 79, 0.45);
    width: 100%;
    max-width: 720px;
    height: auto;
    background: #000;
    touch-action: none;
  }

  #hint {
    color: #ffd83d;
    font-size: 0.72rem;
    letter-spacing: 1px;
    text-align: center;
    text-shadow: 0 0 6px #ffd83d;
  }
</style>
</head>
<body>
  <div id="wrap">
    <a id="back" href="../../launcher/index.html">&larr; BACK TO MICKLECADE</a>
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hint">ARROWS / D-PAD TO MOVE &mdash; SPACE / A BUTTON TO MUNCH &mdash; OR JUST TAP A BOX</div>
  </div>
  <script src="../../shared/gamepad.js"></script>
  <script src="../../shared/hires.js"></script>
  <script src="game.js"></script>
</body>
</html>
